name: ManzoApp
options:
  bundleIdPrefix: com.manzo
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: ManzoApp
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # Bridging header
    SWIFT_OBJC_BRIDGING_HEADER: ManzoApp/ManzoApp-Bridging-Header.h
    # Where to find libmanzo_core.a and libmpg123.dylib (copied to stable path by pre-build script)
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../manzo-core/target/aarch64-apple-darwin/release"
    # Where to find manzo_core.h (for the bridging header #include)
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../manzo-core"
    # Link the static Rust library and the mpg123 dylib it depends on
    OTHER_LDFLAGS: "-lmanzo_core -lmpg123"

targets:
  ManzoApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    settings:
      base:
        ARCHS: arm64
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../manzo-core/target/aarch64-apple-darwin/release"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../manzo-core"
        OTHER_LDFLAGS: "-lmanzo_core -lmpg123"
        SWIFT_OBJC_BRIDGING_HEADER: ManzoApp/ManzoApp-Bridging-Header.h
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: AudioUnit.framework
      - sdk: AudioToolbox.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    sources:
      - path: ManzoApp
        excludes:
          - "*.yml"
    info:
      path: ManzoApp/Info.plist
      properties:
        CFBundleName: ManzoApp
        CFBundleIdentifier: com.manzo.ManzoApp
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        NSPrincipalClass: NSApplication
        NSMainNibFile: ""
        LSMinimumSystemVersion: "15.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    preBuildScripts:
      - name: "Build Rust manzo-core"
        shell: /bin/zsh
        script: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release \
            --manifest-path "$SRCROOT/../manzo-core/Cargo.toml" \
            --target aarch64-apple-darwin
          # Re-generate the C header after build — hard-fail if cbindgen is absent
          (cd "$SRCROOT/../manzo-core" && cbindgen \
            --config cbindgen.toml \
            --output manzo_core.h) \
            || { echo "error: cbindgen not found — install with: cargo install cbindgen"; exit 1; }
          # Copy libmpg123.dylib to the stable release dir so Xcode linker can find -lmpg123
          MPG123_LIB=$(find "$SRCROOT/../manzo-core/target/aarch64-apple-darwin/release/build" \
            -name "libmpg123.dylib" -not -name "libmpg123.0.dylib" 2>/dev/null | head -1)
          if [ -n "$MPG123_LIB" ]; then
            cp "$MPG123_LIB" "$SRCROOT/../manzo-core/target/aarch64-apple-darwin/release/libmpg123.dylib"
          fi
        outputFiles:
          - $(SRCROOT)/../manzo-core/target/aarch64-apple-darwin/release/libmanzo_core.a
