<!doctype html>
<html><head><meta charset="utf-8"><title>Transport buttons</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="neo" style="padding:14px 18px; display:flex; flex-direction:column; gap:12px;">
    <div class="row" style="gap:10px; justify-content:center;">
      <!-- SVG transport buttons — prev, play, pause, stop, next -->
      <button class="btn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 3 L4 15 M6 9 L15 3 L15 15 Z" fill="#c7ccd9" stroke="#c7ccd9" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M6 4 L18 11 L6 18 Z" fill="#fff"/></svg></button>
      <button class="btn"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="4" y="3" width="4" height="12" fill="#c7ccd9"/><rect x="10" y="3" width="4" height="12" fill="#c7ccd9"/></svg></button>
      <button class="btn"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="4" y="4" width="10" height="10" fill="#c7ccd9"/></svg></button>
      <button class="btn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 3 L12 9 L3 15 Z M14 3 L14 15" fill="#c7ccd9" stroke="#c7ccd9" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
      <div style="width:1px; height:22px; background: color(display-p3 1 1 1 / 0.15);"></div>
      <button class="btn"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9 L8 4 L8 7 L15 7 L15 11 L8 11 L8 14 Z" fill="#c7ccd9"/></svg></button>
    </div>
    <div class="row" style="gap:8px; justify-content:center;">
      <span class="tag">prev</span><span class="tag">play</span><span class="tag">pause</span><span class="tag">stop</span><span class="tag">next</span><span class="tag">· eject</span>
    </div>
  </div>
  <div class="tag">Transport glyphs — icons/cbuttons.bmp, rendered as SVG in web kit</div>
</div>
<style>
.btn {
  all: unset;
  width:30px; height:26px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:4px;
  background: linear-gradient(to bottom, color(display-p3 1 1 1 / 0.12), color(display-p3 1 1 1 / 0.03));
  box-shadow: inset 0 0 0 1px color(display-p3 1 1 1 / 0.20), inset 0 1px 0 color(display-p3 1 1 1 / 0.30);
  cursor:pointer;
}
.btn:hover { background: linear-gradient(to bottom, color(display-p3 1 1 1 / 0.22), color(display-p3 1 1 1 / 0.06)); }
.btn:active { background: color(display-p3 0 0 0 / 0.3); box-shadow: inset 0 0 0 1px color(display-p3 1 1 1 / 0.15), inset 0 1px 2px rgba(0,0,0,0.5); }
</style>
</body></html>
