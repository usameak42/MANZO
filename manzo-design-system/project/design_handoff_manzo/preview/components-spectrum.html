<!doctype html>
<html><head><meta charset="utf-8"><title>Spectrum analyzer</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="neo" style="padding:14px; display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="width: 225px; height: 32px; display:flex; align-items:flex-end; gap:0; position:relative; background: color(display-p3 0 0 0 / 0.35); border-radius:2px; padding:1px;" id="spec"></div>
    <div class="row" style="gap:18px;">
      <span class="tag">75 bars × 3pt</span>
      <span class="tag">16 levels × 2pt</span>
      <span class="tag">peak: −1.1/frame</span>
      <span class="tag">60 fps</span>
    </div>
  </div>
  <div class="tag">ManzoSpectrumView — 225×32pt, green→yellow→red, white peak holds</div>
</div>
<script>
const spec = document.getElementById('spec');
const bars = 75;
const container = document.createElement('div');
container.style.cssText = 'display:flex; gap:0; align-items:flex-end; width:100%; height:100%; position:relative;';
spec.appendChild(container);

const heights = [];
const peaks = [];
for (let i=0;i<bars;i++) {
  const v = Math.max(0.08, Math.sin(i*0.2)*0.4 + Math.random()*0.5 + 0.3);
  heights.push(Math.min(1, v));
  peaks.push(Math.min(1, v+0.1));
  const col = document.createElement('div');
  col.style.cssText = 'width:3px; position:relative; height:100%; display:flex; align-items:flex-end;';
  const bar = document.createElement('div');
  bar.style.cssText = `width:3px; height:${heights[i]*100}%; background: linear-gradient(to top, color(display-p3 0.13 0.85 0.47) 0%, color(display-p3 0.98 0.92 0.16) 65%, color(display-p3 1 0.35 0.20) 100%);`;
  const peak = document.createElement('div');
  peak.style.cssText = `position:absolute; left:0; right:0; bottom:${peaks[i]*100}%; height:2px; background:#fff;`;
  col.appendChild(bar);
  col.appendChild(peak);
  container.appendChild(col);
}
</script>
</body></html>
