<!doctype html>
<html><head><meta charset="utf-8"><title>Radii · rim · shadow</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:16px; align-items:flex-end;">
    <div class="col" style="align-items:center; gap:6px;">
      <div class="neo" style="width:120px; height:80px;"></div>
      <div class="swatch-name">radius-bubble · 10</div>
      <div class="swatch-label mono">container corner</div>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:120px; height:80px; background:#232334; border-radius:10px; position:relative;">
        <div style="position:absolute; inset:0.5px; border:1px solid color(display-p3 1 1 1 / 0.45); border-radius:9.5px;"></div>
      </div>
      <div class="swatch-name">rim · 1pt</div>
      <div class="swatch-label mono">α 0.45 · inset 0.5</div>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:120px; height:80px; background:#232334; border-radius:10px; box-shadow: 0 24px 64px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);"></div>
      <div class="swatch-name">window shadow</div>
      <div class="swatch-label mono">borderless NSWindow</div>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:120px; height:80px; border-radius:10px; background: linear-gradient(to bottom, #232334 0% 50%, #0e0e17 50% 100%); position:relative;">
        <div style="position:absolute; left:0; right:0; top:50%; height:50%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(0,0,0,0.6)); opacity:0.5; border-radius:0 0 10px 10px;"></div>
      </div>
      <div class="swatch-name">wet-floor</div>
      <div class="swatch-label mono">α 0.50 · flipped Y</div>
    </div>
  </div>
  <div class="tag">Geometry primitives — bubble radius, 1pt rim, drop shadow, reflection</div>
</div>
</body></html>
