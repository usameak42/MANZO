<!doctype html>
<html><head><meta charset="utf-8"><title>Window geometry</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:18px; align-items:flex-end;">
    <div class="col" style="align-items:center; gap:6px;">
      <div class="neo" style="width:220px; height:92px; display:flex; flex-direction:column; overflow:hidden;">
        <div style="height:14px; background: color(display-p3 1 1 1 / 0.08); display:flex; align-items:center; justify-content:center; font-size:9px; color: color(display-p3 0.58 0.60 0.65); text-transform:uppercase; letter-spacing:0.06em;">MANZO</div>
        <div style="flex:1; position:relative; padding:6px 10px;">
          <div class="pixel" style="font-size:12px;">1. Fourth of July</div>
          <div class="lcd" style="font-size:18px;">1:47</div>
        </div>
        <div style="height:14px; background: color(display-p3 0 0 0 / 0.2);"></div>
      </div>
      <div class="swatch-name">Main · 275 × 116pt</div>
      <div class="swatch-label mono">14 / 88 / 14</div>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div class="neo" style="width:280px; height:120px; display:flex; flex-direction:column; overflow:hidden;">
        <div style="height:14px; background: color(display-p3 1 1 1 / 0.08); display:flex; align-items:center; justify-content:center; font-size:9px; color: color(display-p3 0.58 0.60 0.65); text-transform:uppercase; letter-spacing:0.06em;">Playlist Editor</div>
        <div style="flex:1; display:flex; flex-direction:column;">
          <div style="height:24px; padding:0 10px; display:flex; align-items:center; font-family:-apple-system; font-size:11px; color: color(display-p3 0.78 0.80 0.85);">01. Gold Panda — Lucky Shiner</div>
          <div style="height:24px; padding:0 10px; display:flex; align-items:center; font-family:-apple-system; font-size:11px; color:#fff; background: color(display-p3 0.15 0.45 0.85 / 0.70); border-radius:3px; margin:0 4px;">02. Bonobo — Black Sands</div>
          <div style="height:24px; padding:0 10px; display:flex; align-items:center; font-family:-apple-system; font-size:11px; color: color(display-p3 0.78 0.80 0.85);">03. Rustie — Glass Swords</div>
        </div>
        <div style="height:16px; background: color(display-p3 0 0 0 / 0.2); padding:0 10px; display:flex; align-items:center; justify-content:space-between; font-family:-apple-system; font-size:10px; color: color(display-p3 0.58 0.60 0.65);"><span>3 tracks</span><span>12:41</span></div>
      </div>
      <div class="swatch-name">Playlist · 350 × auto</div>
      <div class="swatch-label mono">row 24 · bar 16</div>
    </div>
  </div>
  <div class="tag">ManzoWindow sizes — NSWindow.Frame.init(275,116), playlist resizable</div>
</div>
</body></html>
