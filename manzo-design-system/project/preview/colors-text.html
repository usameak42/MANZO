<!doctype html>
<html><head><meta charset="utf-8"><title>Text colors</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="neo" style="padding:14px 16px; display:flex; flex-direction:column; gap:8px;">
    <div style="color:#fff; font-size:13px;">fg-1 · active track · P3(1,1,1)</div>
    <div style="color: color(display-p3 0.78 0.80 0.85); font-size:13px;">fg-2 · body · #C7CCD9 / P3(0.78,0.80,0.85)</div>
    <div style="color: color(display-p3 0.58 0.60 0.65); font-size:13px;">fg-3 · dim label · #949AA7 / P3(0.58,0.60,0.65)</div>
    <div style="color: color(display-p3 0.78 0.80 0.85 / 0.45); font-size:13px;">fg-subtle · empty-state body · 45% alpha</div>
    <div style="color: color(display-p3 0.50 0.52 0.55 / 0.70); text-decoration: line-through; font-size:13px;">fg-missing · strikethrough, 70% alpha</div>
  </div>
  <div class="tag">Text roles extracted from PlaylistRowView.swift & ManzoPlaylistPanel.swift</div>
</div>
</body></html>
