<!doctype html>
<html><head><meta charset="utf-8"><title>Accent colors</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:10px;">
    <div class="col">
      <div class="swatch" style="background: color(display-p3 0.15 0.45 0.85 / 0.70);"></div>
      <div class="swatch-name">selection</div>
      <div class="swatch-label">blue · 70% α</div>
    </div>
    <div class="col">
      <div class="swatch" style="background: color(display-p3 0.13 0.85 0.47);"></div>
      <div class="swatch-name">spectrum-low</div>
      <div class="swatch-label">green</div>
    </div>
    <div class="col">
      <div class="swatch" style="background: color(display-p3 0.98 0.92 0.16);"></div>
      <div class="swatch-name">spectrum-hi</div>
      <div class="swatch-label">yellow</div>
    </div>
    <div class="col">
      <div class="swatch" style="background: color(display-p3 1 0.35 0.20);"></div>
      <div class="swatch-name">spectrum-peak</div>
      <div class="swatch-label">red top</div>
    </div>
    <div class="col">
      <div class="swatch" style="background: color(display-p3 0.13 0.85 0.47); box-shadow: 0 0 14px color(display-p3 0.13 0.85 0.47 / 0.8);"></div>
      <div class="swatch-name">lcd-digit</div>
      <div class="swatch-label">+ glow</div>
    </div>
  </div>
  <div class="tag">Accent roles — spectrum gradient, LCD, row selection</div>
</div>
</body></html>
