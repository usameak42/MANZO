<!doctype html>
<html><head><meta charset="utf-8"><title>Base gradients</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:14px; align-items:stretch; height:120px;">
    <div class="col" style="flex:1;">
      <div class="swatch swatch--tall" style="flex:1; border-radius:10px; background: linear-gradient(to bottom, color(display-p3 0.10 0.10 0.10), color(display-p3 0.23 0.23 0.23)); box-shadow: inset 0 0 0 1px color(display-p3 1 1 1 / 0.45), 0 6px 14px rgba(0,0,0,0.4);"></div>
      <div class="swatch-name">winampClassic</div>
      <div class="swatch-label mono">P3 .10 .10 .10 → .23 .23 .23</div>
    </div>
    <div class="col" style="flex:1;">
      <div class="swatch swatch--tall" style="flex:1; border-radius:10px; background: linear-gradient(to bottom, color(display-p3 0.05 0.78 0.82), color(display-p3 0.02 0.52 0.60)); box-shadow: inset 0 0 0 1px color(display-p3 1 1 1 / 0.45), 0 6px 14px rgba(0,0,0,0.4);"></div>
      <div class="swatch-name">neoAero</div>
      <div class="swatch-label mono">P3 .05 .78 .82 → .02 .52 .60</div>
    </div>
    <div class="col" style="flex:1;">
      <div class="swatch swatch--tall" style="flex:1; border-radius:10px; background: linear-gradient(to bottom, color(display-p3 0.04 0.09 0.20), color(display-p3 0.10 0.22 0.28)); box-shadow: inset 0 0 0 1px color(display-p3 1 1 1 / 0.45), 0 6px 14px rgba(0,0,0,0.4);"></div>
      <div class="swatch-name">indigoTeal</div>
      <div class="swatch-label mono">P3 .04 .09 .20 → .10 .22 .28</div>
    </div>
  </div>
  <div class="tag">ColorTheme cases — ManzoVisualStyle.swift · baseTop → baseBottom</div>
</div>
</body></html>
